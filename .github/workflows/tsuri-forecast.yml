# 東京湾 釣れ予報：Open-Meteo から海況・天気を取得して tsuri-yoho/data/forecast.json を更新する
# 1回あたり1分未満。公開リポジトリなら無料、非公開でも無料枠（月2,000分）内に収まる（4回/日 × 30日 ≒ 120分）。
name: tsuri-yoho forecast

on:
  schedule:
    # UTC表記。日本時間 4:17 / 10:17 / 16:17 / 22:17（混雑する0分を避けている）
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch: {}   # Actions画面の「Run workflow」ボタンから手動実行も可能

permissions:
  contents: write

concurrency:
  group: tsuri-forecast
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch forecast
        run: python tsuri-yoho/scripts/fetch_forecast.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add tsuri-yoho/data/forecast.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "tsuri-yoho: update forecast data"
            git push
          fi
